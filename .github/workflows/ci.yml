name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm test:integration
      - run: pnpm api:generate && git diff --exit-code -- docs/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm build
      - run: pnpm --filter @lms/mobile exec expo install --check
      - run: pnpm --filter @lms/mobile export:android
      - run: python -m pip install -r services/asr/requirements.lock
      - run: python -m pytest services/asr -q
      - run: node scripts/init-local.mjs
      - run: docker compose --env-file .env -f infra/compose/compose.yaml up -d --wait
      - run: pnpm test:storage
      - run: pnpm test:media
        env:
          PYTHON_EXECUTABLE: python
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:media
        env:
          PYTHON_EXECUTABLE: python
      - if: always()
        run: docker compose --env-file .env -f infra/compose/compose.yaml stop
